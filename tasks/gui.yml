---
- name: Install GUI applications and developer fonts via Homebrew Cask
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
    accept_external_apps: true
    install_options: "force"
  loop: "{{ gui_casks }}"
  when: gui_casks is defined and gui_casks | length > 0
  ignore_errors: true
