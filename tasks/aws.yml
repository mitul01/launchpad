---
- name: Install AWS CLI via Homebrew
  community.general.homebrew:
    name: "{{ item }}"
    state: present
  loop: "{{ aws_packages }}"

- name: Install AWS Session Manager plugin via Homebrew Cask
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
    accept_external_apps: true
    install_options: "force"
  loop: "{{ aws_casks }}"
  when: aws_casks is defined and aws_casks | length > 0
  become: true
  ignore_errors: true

- name: Ensure ~/.aws configuration directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.aws"
    state: directory
    mode: '0700'

- name: Deploy templated ~/.aws/config
  ansible.builtin.template:
    src: templates/aws/config.j2
    dest: "{{ ansible_facts['user_dir'] }}/.aws/config"
    mode: '0600'
    backup: true
