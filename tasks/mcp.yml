---
- name: Ensure MCP configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ ansible_facts['user_dir'] }}/.config/mcp"
    - "{{ ansible_facts['user_dir'] }}/.config/antigravity"

- name: Deploy MCP server configuration to ~/.config/mcp/mcp.json
  ansible.builtin.template:
    src: templates/mcp/mcp.json.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/mcp/mcp.json"
    mode: '0600'
    backup: true

- name: Deploy MCP server configuration to ~/.config/antigravity/mcp_config.json
  ansible.builtin.template:
    src: templates/mcp/mcp.json.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/antigravity/mcp_config.json"
    mode: '0600'
    backup: true
