---
- name: Ensure Python CLI tools (uv, ruff) are installed via Homebrew
  community.general.homebrew:
    name: "{{ item }}"
    state: present
  loop: "{{ python_packages }}"
  failed_when: false

- name: Remove Python versions not explicitly allowed
  ansible.builtin.shell: |
    set -e
    allowed="{{ python_default_versions | join(' ') }}"
    removed=""
    while IFS= read -r line; do
      [ -n "$line" ] || continue
      version="${line%% *}"
      if [[ "$version" =~ ^cpython-([0-9]+\.[0-9]+) ]]; then
        version="${BASH_REMATCH[1]}"
      else
        continue
      fi
      case " $allowed " in
        *" $version "*) continue ;;
      esac
      "{{ homebrew_prefix }}/bin/uv" python uninstall --managed-python "$version" || true
      removed="${removed}${removed:+$'\n'}$version"
    done < <("{{ homebrew_prefix }}/bin/uv" python list --only-installed --managed-python 2>/dev/null)
    printf '%s\n' "$removed"
  args:
    executable: /bin/bash
  register: stale_python_versions
  changed_when: stale_python_versions.stdout | trim | length > 0

- name: Install default Python versions using uv
  ansible.builtin.command:
    cmd: "{{ homebrew_prefix }}/bin/uv python install {{ item }}"
  loop: "{{ python_default_versions }}"
  register: uv_python_install
  changed_when: "'Installed' in uv_python_install.stderr or 'Installed' in uv_python_install.stdout"

- name: Remove uv tools not explicitly allowed
  ansible.builtin.shell: |
    set -e
    allowed="{{ python_global_tools | join(' ') }}"
    removed=""
    while IFS= read -r line; do
      [ -n "$line" ] || continue
      case "$line" in
        -*) continue ;;
      esac
      tool="${line%% *}"
      case " $allowed " in
        *" $tool "*) continue ;;
      esac
      "{{ homebrew_prefix }}/bin/uv" tool uninstall "$tool" || true
      removed="${removed}${removed:+$'\n'}$tool"
    done < <("{{ homebrew_prefix }}/bin/uv" tool list 2>/dev/null)
    printf '%s\n' "$removed"
  args:
    executable: /bin/bash
  register: stale_uv_tools
  changed_when: stale_uv_tools.stdout | trim | length > 0

- name: Install global Python tools using uv tool
  ansible.builtin.command:
    cmd: "{{ homebrew_prefix }}/bin/uv tool install {{ item }}"
  loop: "{{ python_global_tools }}"
  register: uv_tool_install
  changed_when: "'Installed' in uv_tool_install.stderr or 'Installed' in uv_tool_install.stdout"
  when: python_global_tools is defined and python_global_tools | length > 0

- name: Create Fish completions directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/fish/completions"
    state: directory
    mode: '0755'

- name: Generate Fish completions for uv
  ansible.builtin.shell: |
    {{ homebrew_prefix }}/bin/uv generate-shell-completion fish > {{ ansible_facts['user_dir'] }}/.config/fish/completions/uv.fish
  args:
    creates: "{{ ansible_facts['user_dir'] }}/.config/fish/completions/uv.fish"
