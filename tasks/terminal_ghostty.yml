---
- name: Create Ghostty configuration directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/ghostty"
    state: directory
    mode: '0755'

- name: Deploy Ghostty configuration file
  ansible.builtin.template:
    src: templates/ghostty/config.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/ghostty/config"
    mode: '0644'
