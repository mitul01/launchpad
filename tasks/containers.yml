---
- name: Install OrbStack (modern container engine for macOS)
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
    accept_external_apps: true
    install_options: "force"
  loop: "{{ container_casks }}"
  ignore_errors: true

- name: Install Docker CLI utilities and terminal tools
  community.general.homebrew:
    name: "{{ item }}"
    state: present
  loop: "{{ container_packages }}"
