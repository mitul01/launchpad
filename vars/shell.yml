---
shell_packages:
  - bash
  - fish
  - fisher
  - fzf
  - starship

fish_plugins:
  - jorgebucaran/fisher
  - PatrickF1/fzf.fish
  - jethrokuan/z

fish_aliases:
  g: "git"
  k : "kubectl"

fish_environment_vars:
  EDITOR: "nano"
  VISUAL: "nano"

ghostty_font_family: "JetBrainsMono Nerd Font"
ghostty_font_size: 13
ghostty_theme: "Catppuccin Mocha"
